# Build configuration for native Win32 i386 using 32-bit MinGW-w64 GCC.

host_os   = win32
host_arch = i386
os_family = javacall
arch      = i386
compiler  = gcc

GNU_TOOLS_PREFIX = i686-w64-mingw32-
ASM = as
CPLUSPLUS_FLAGS += -std=gnu++11
ENABLE_COMPILATION_WARNINGS ?= true

ifeq ($(JAVACALL_OUTPUT_DIR),)
$(error JAVACALL_OUTPUT_DIR is not set)
endif

CPP_DEF_FLAGS += -I$(PCSL_OUTPUT_DIR)/javacall_i386/inc
LINK_FLAGS += -m32 -lgcc -lws2_32
ASM_FLAGS += --32

PCSL_DIST_DIR = $(PCSL_OUTPUT_DIR)/javacall_i386

MakeDepsMain_win32_gcc = UnixPlatform
MakeDepsMain_javacall_gcc = UnixPlatform
MakeDepsOpts_javacall = -resolveVpath true

LOOP_GEN_FLAGS = +GenerateGNUCode +AddExternCUnderscore
ROM_GEN_FLAGS  = +GenerateGNUCode

VERBOSE_MAKE=true

ifndef ENABLE_TIMER_THREAD
ENABLE_TIMER_THREAD = false
export ENABLE_TIMER_THREAD__BY = javacall_i386_mingw.cfg
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES = true
export MERGE_SOURCE_FILES
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE = 35
export SOURCE_MERGER_SIZE
endif

ifeq ($(IsLoopGen),true)
    os_family = $(host_os)
endif

ifeq ($(IsRomGen),true)
    os_family = $(host_os)
endif

ifeq ($(IsTarget),true)
    export ENABLE_PCSL = true
    arch = i386
    export skip_link_image := false

    JAVACALL_INCLUDE_DIR=$(JAVACALL_OUTPUT_DIR)/inc
    CPP_DEF_FLAGS += -I$(JAVACALL_INCLUDE_DIR) -DWIN32

    ifeq ($(USE_DEBUG),true)
    BUILD_EXT_javacall=_g
    else
    BUILD_EXT_javacall=
    endif

    JAVACALL_LIB_DIR=$(JAVACALL_OUTPUT_DIR)/lib
    JAVACALL_LIB=$(JAVACALL_LIB_DIR)/libjavacall$(BUILD_EXT_javacall).a
    JC_STUBS_OBJ=$(JAVACALL_LIB) -lws2_32 -lwinmm -lgdi32 -luser32
    LINK_FLAGS += $(JAVACALL_LIB)
endif
